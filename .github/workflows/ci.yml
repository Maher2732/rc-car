name: CI

on:
  push:
  pull_request:

jobs:
  pi-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install "python-can>=4.3"
      - name: Unit tests
        working-directory: pi
        run: python -m unittest discover -s tests -t . -v

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [DRIVE, TELEMETRY, CAN_SENDER, CAN_RECEIVER]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build ${{ matrix.role }} role
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32
          path: firmware
          command: >-
            echo "CONFIG_BOARD_ROLE_${{ matrix.role }}=y" > role.defaults &&
            idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;role.defaults" build
